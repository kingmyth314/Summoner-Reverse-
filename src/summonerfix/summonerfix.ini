; SummonerFix settings. Copy this file and dinput.dll next to Sum.exe, then start Sum.exe directly
; (the original launcher is not needed).

[Display]
; OpenGL (recommended for modern drivers), Direct3D, or Glide (needs a Glide wrapper).
Renderer=OpenGL
; OpenGL output: Fullscreen (borderless, native monitor resolution) or Window.
Mode=Fullscreen
; Client size used when Mode=Window (the window can also be resized).
WindowWidth=1600
WindowHeight=1200
; The game's internal layout resolution. The UI is designed for 1024x768; OpenGL scales it to the
; screen and draws the 3D world at the screen's native resolution.
GameWidth=1024
GameHeight=768
; OpenGL only: cap on the texture size reported by the driver (the game allocates size*size*4 bytes).
MaxTextureSize=2048
; Direct3D/Glide only: 1 = run the game's own windowed mode.
Windowed=0

[Game]
; Frame-rate cap. 0 = the game's default (120).
MaxFPS=0

[Sound]
; DirectSound, or "No Sound"
Soundcard=DirectSound

[Debug]
; 1 = log error dialogs, exits, large allocations and frame rate to summonerfix.log
Diagnostics=0
; seconds between frame captures (summonerfix-capture-N.bmp), 0 = off
CaptureEvery=0

; Values the game saves for itself (it would normally keep them in the registry).
[Registry]
