; SummonerFix settings. Copy this file and dinput.dll next to Sum.exe, then start Sum.exe directly
; (the original launcher is not needed).

[Display]
; OpenGL (recommended for modern drivers), Direct3D, or Glide (needs a Glide wrapper).
Renderer=OpenGL
; OpenGL output: Fullscreen (borderless, native monitor resolution) or Window.
Mode=Fullscreen
; Client size used when Mode=Window (the window can also be resized).
WindowWidth=1600
WindowHeight=1200
; The game's internal layout resolution. The UI is designed for 1024x768; OpenGL scales it to the
; screen and draws the 3D world at the screen's native resolution.
GameWidth=1024
GameHeight=768
; With a wider GameWidth (e.g. 1366 for 16:9): 1 = centre the 1024-wide menus (bars on both sides).
CenterMenus=1
; With a wider GameWidth: 1 = centre the 1024-wide HUD and in-game screens; the 3D world uses the full width.
CenterHud=1
; With a wider GameWidth: 1 = the world stays full width behind the map/spells/skills panels (no camera jump).
SidePanelsOverWorld=1
; OpenGL only: cap on the texture size reported by the driver (the game allocates size*size*4 bytes).
MaxTextureSize=2048
; OpenGL only: how the options screen's brightness slider is applied. Auto = redraw the frame through the
; brightness curve (OpenGL 2.0), else the monitor's gamma ramp; Shader; Ramp (whole monitor while the game is in
; front); Off = ignore the slider, as the original game does under OpenGL.
Brightness=Auto
; Direct3D/Glide only: 1 = run the game's own windowed mode.
Windowed=0

[Game]
; Frame-rate cap. 0 = the game's default (120).
MaxFPS=0
; Key that opens SummonerFixConfig.exe while playing (key name, or none).
ConfigKey=F10
; This key runs the game faster (fast travel). SpeedFactor 1-8; high values may make movement
; and collisions less reliable.
SpeedKey=F11
SpeedFactor=3
; Toggle = each press of SpeedKey turns fast mode on/off ("FAST x3" shows at the top left); Hold = only while held.
SpeedMode=Toggle
; Optional (empty or 0 = original game): camera zoom-out limit (game 1.0, e.g. 3), skip the Volition/EAX
; logo movies (1), and how far away you can talk/use (InteractRange) or open containers (ContainerRange)
; in world units (game 5).
CameraZoomMax=
SkipIntroMovies=0
InteractRange=
ContainerRange=

[Sound]
; DirectSound, or "No Sound"
Soundcard=DirectSound

[Fixes]
; Fixes for bugs in the original game (docs/sum-exe/game-bugs.md). 1 = fixed (default), 0 = as the original game
; does it. Read when the game starts. The fix for the no-sound-device crash is always on.
; Enabled=0 turns all of the fixes below off at once (SummonerFixConfig: "Fix bugs in the original game").
Enabled=1
; The Robe of Restoration's heal goes to its wearer, not to the enemy that hit her (G300)
RobeOfRestoration=1
; World sounds follow the sound-effects slider linearly, not squared (K260)
WorldSoundVolume=1
; Full-detail textures on a fresh OpenGL install (K64)
OpenGLTextures=1
; Brass, Steel and Iron Golems show a hit effect (K20)
MetalHitEffects=1
; Rows of the multiplayer death and PXO popups light up under the cursor, not 5 px above (K170)
PopupRowOffset=1
; Saving on the top row of a scrolled save list asks before overwriting (G4)
SaveOverwriteQuestion=1
; The Phoenix Rider's Inferno hits each party member in range once, not its target once per member (G215).
; This makes the Phoenix fight easier than the original game.
PhoenixInferno=1
; No crash when the target of the Luminar's lightning beam dies or disappears before the beam hits (C250)
LuminarBeamTarget=1
; When a summon goes, the hero you control stays in control instead of the first party member (G8)
SummonKeepsLeader=1
; Spell cooldowns use the recovery times in spells.tbl, not the spell's record number (G12). Fireball recovers in
; 20 s instead of 26; some monster spells come back faster, others slower (vitalize 10 s instead of 4).
SpellRecoveryTimes=1
; A gold pile left on the ground keeps its amount after loading the game, instead of 1 gold (G40)
GoldPileAmount=1
; A warning such as "Cannot save in combat." shown while you have paused the game leaves it paused (G170)
MessageBoxPause=1
; "Give him 10 gold pieces." to Canis the Mercenary in occupied Lenele takes 10 gold, not 100 (G301)
CanisTenGold=1
; An AI healer counts each party member once when choosing Bless or Protect (C210: no crash in a hard fight;
; G212: Protect only when three members need it)
AiBlessCount=1
; Fire, blizzard and dark wall areas keep burning when the caster of an earlier area has gone (G270)
AreaCasterGone=1
; A Support-style party member (Flece by default) keeps the enemy it chose instead of a random one (G211)
SupportAiTarget=1
; Summons notice enemies ahead of them, not behind them, beyond their detection range (G210)
DetectionCone=1
; The leech special ability (Blood Elemental, Crystal Rokhul, Joseph's Wraith) drains HP from the creature hit
; into the attacker; in the original game it does nothing in single player (G100)
LeechDrain=1
; A conversation's "more" and "end" light up only with the mouse on them (K292)
ConversationHover=1
; With the save list scrolled, the top row shows its save's picture, not the current scene (K5)
SaveListThumbnail=1
; While Zane is about (game stages 4-8), grassland encounters bring his encounter about half the time (G6)
ZaneEncounter=1
; The party AI knows when the Phoenix and Ghost riders are mounted, from their own fight stage (G32)
MountedRiders=1
; The Priest King fight plays the Boss music, and Liangshan's own music returns after both riders die (K130, K150)
BossMusic=1
; A ring's higher summon is usable and announced from a power of exactly 60,000 on, as its pop-up lists it (K100)
RingSixtyThousand=1
; A 33rd label on a map is refused instead of replacing the first one (K6)
MapLabelLimit=1
; In a shop's sell list the category buttons jump to your own items of that category (K3)
ShopCategoryButtons=1
; When identifying items, the category buttons jump to the unidentified items of that category (K4)
InventoryCategoryButtons=1
; Leaving a level frees all of its ambient sounds, so towns keep their sounds after many visits (K110)
AmbientSounds=1
; A container's scrollbar thumb is sized to the shown part of the list and stays inside its track (K12)
PickupScrollbar=1
; Letting go of a drag with the cursor at a screen edge does not turn the camera until the cursor leaves the edge (K191)
EdgeTurnAfterDrag=1
; A monster's dropped loot flashes pale gold, as in the game's data, instead of yellow (K61)
LootHighlightColour=1
; "Knocked Down!" is shown only when your character really falls, not while casting (K80)
KnockDownMessage=1
; The game starts from a folder with a long path (116+ characters) instead of crashing, using the folder's short name (C310)
LongInstallPath=1
; A status effect's glow no longer counts as a burning fireball, so party AI casters keep choosing fireball (G271)
EffectSlotSpell=1
; Enemy mages cast meteor storm and inferno only when two of your party are really within reach (G241)
AreaSpellDistances=1
; Curse, wrath of god, meteor storm and other spells play their hit sound where they land, not at a stray spot (K300)
SpellHitSoundPosition=1
; With 128 map labels saved, deleting or editing a label is still saved (K40)
MapLabelsFull=1
; Party AI healers heal a hurt member every time they decide to, instead of often casting nothing (G229).
; Enemy healers heal somewhat more often than in the original game, but less than yours.
SupportSpellPick=1
; When the sound card refuses the 3D primary sound buffer, the game starts with plain sound (or none) instead of crashing (C2)
PrimarySoundBuffer=1
; On PCs whose high-resolution timer runs at 4.29 GHz or more, the game runs at normal speed instead of many times too fast (G2)
QpcFrequency=1
; Print Screen saves each screenshot under a new number, past screen999 and with other screen... files in the folder (K193)
ScreenshotNumbers=1
; No crash in the Masad combat tutorial (and some level starts) when an arrow, spell area or status effect is around (C272)
EffectSearchGuard=1
; Murod's leap (and the Luminar's teleport) no longer aims at a dead or dying hero (G253)
BossAnchorsAlive=1
; Murod Oni turns to bite a hero behind it at most once per 5 s, as its timer intends (G252)
MurodBackBiteTimer=1
; The Serpent's poison and the Ghost's fear and death strikes land only when the blow itself is in reach (G31)
BossSpellInRange=1
; After changing target, the mounted Serpent checks whether its new target is asleep, not another hero (G213)
SerpentSleepTest=1

[Experimental]
; Game mechanics the developers left switched off, made to work. Off by default; see docs/future.
; 1 = the Tentacle Beast's tentacles can pick up, hold and throw a party member (G250).
TentacleGrab=0
; How often (percent) a tentacle that may grab tries to, per decision.
TentacleGrabChance=10
; Autosave (experimental build Sum-exp.exe only): saves into autosave1.sav .. autosaveN.sav, never into your own
; saves or quicksave.sav, and only where the game itself allows saving (no combat, cutscene, menu, multiplayer).
Autosave=0
; Minutes of play (paused time and menus do not count) between autosaves; 0 = only on level changes.
AutosaveMinutes=5
; 1 = also autosave after entering a new level (not after loading a save).
AutosaveOnLevelChange=1
; Number of rotating autosave files (1..10); the oldest is replaced.
AutosaveSlots=3
; Experimental build only. Frame-rate cap in frames per second (30-240); 0 = the game's own (120).
; The game's speed does not change with the cap, only the smoothness.
FrameRateCap=0
; Experimental build only, OpenGL renderer: 1 = wait for vertical sync (no tearing; the frame rate then follows
; the monitor's refresh rate, up to FrameRateCap). 0 = as the game (no vsync under OpenGL).
VSync=0

[Controller]
; An XInput controller (Xbox-style gamepad; a PS5 DualSense is not one) drives the mouse and keys. SummonerFix: needs
; the OpenGL renderer; Sum-exp.exe reads it itself with any renderer. Read when the game starts. 1 = on.
Enabled=0
; Left stick: dead zone (0-30000 of 32767) and cursor speed at full deflection, in game pixels per second
; (the screen is 1024 game pixels wide).
DeadZone=7849
CursorSpeed=800
; Right stick: how far it must be pushed (of 32767) to hold a camera key; triggers: how far (of 255) to press.
CameraThreshold=16000
TriggerThreshold=30
; What each input presses: a game key name (as in [KeyBindings]), MouseLeft, MouseRight, MouseMiddle, or none.
; These are the game's own keys: [KeyBindings] do not change them.
A=MouseLeft
B=MouseRight
X=X
Y=I
LB=Tab
RB=H
LT=LShift
RT=Space
Start=Esc
Back=M
DPadUp=1
DPadRight=2
DPadDown=3
DPadLeft=4
LS=C
RS=F12
CameraLeft=Left
CameraRight=Right
CameraUp=Up
CameraDown=Down

[Hybrid]
; For decompilation work: run functions rebuilt from the decompiled source in place of the original ones. Dll names
; a DLL made by tools/hybrid-build.mjs, relative to the game folder; empty = off. Skip lists addresses to leave
; original (comma separated, e.g. 0x408620,0x408ba0). Only names a file listing the only addresses to replace.
; Functions SummonerFix patches stay original. Coverage=1 counts the calls of each replaced function (agent
; command hybridcov NAME writes them).
Dll=
Skip=
Only=
Coverage=0
; Dual names a file of addresses checked against the original on the game's own calls (the first DualSamples
; calls of each: both versions run on the same data, differences go to the log). DualIgnore=ADDR:LEN,... (hex)
; leaves more ranges out of the comparison.
Dual=
DualSamples=5
DualIgnore=

[KeyBindings]
; Remap keys: PhysicalKey=GameKey ("press PhysicalKey, the game sees GameKey"). Names: A-Z, 0-9, F1-F12,
; Esc, Tab, Space, Enter, Backspace, LShift, RShift, LCtrl, RCtrl, LAlt, RAlt, Up, Down, Left, Right,
; Home, End, PageUp, PageDown, Insert, Delete, Numpad0-9, NumpadPlus/Minus/Star/Slash/Enter/Period, Grave,
; or a hex scan code such as 0x17. To swap two keys, list both directions. Empty = no remapping.
; Game keys: Esc menu, 1-6 quick slots, Tab party, R status, I inventory, S/C skills/spells, M map,
; X interact, Space pause, F1 help, F5-F9 party members, F12 camera (see docs/sum-exe/controls.md).
; Example: use E to open the inventory and Tab as before:
;E=I

[ConsoleKeys]
; Key=command: pressing Key runs a developer console command (list: docs/sum-exe/console.md). Use keys the
; game does not need; the key still reaches the game too. Examples:
;F=show_framerate
;F9=add_gold 1000

[Debug]
; 1 = log error dialogs, exits, large allocations and frame rate to summonerfix.log
Diagnostics=0
; experimental build only: 1 = write what the experimental features do to experimental.log next to the exe
ExperimentalLog=0
; seconds between frame captures (summonerfix-capture-N.bmp), 0 = off
CaptureEvery=0
; testing only: make the game see this many days of Windows uptime (25+ shows the cutscene timer bug)
FakeUptimeDays=0
; for modders: key that opens Volition's built-in level script editor during gameplay (e.g. F12), none = off.
; WARNING: the editor's Save button writes .tbl files into the game's data folders. Back up the game first.
ScriptEditorKey=none
; testing only: 1 = save and load in Summoner/savetest instead of Summoner/savegame (your own saves stay untouched).
TestSaves=0

; Values the game saves for itself (it would normally keep them in the registry).
[Registry]
